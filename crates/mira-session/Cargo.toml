[package]
name = "mira-session"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Append-only JSONL session journal with an injectable storage seam for Mira"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MrSibe/Mira"
keywords = ["llm", "session", "journal", "jsonl"]
categories = ["api-bindings"]

[dependencies]
# Protocol types only: the journal stores `mira_ai::Message` values, and the HTTP transport is
# not pulled in through this crate.
mira-ai = { version = "0.1.0", path = "../mira-ai", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[package.metadata.docs.rs]
all-features = true
