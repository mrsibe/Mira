[package]
name = "mira-ai"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Portable inference protocol types and an OpenAI-compatible Chat Completions streaming transport"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MrSibe/Mira"
keywords = ["llm", "openai", "chat-completions", "streaming"]
categories = ["api-bindings"]

[features]
default = ["openai-completions"]
# HTTP transport for OpenAI-compatible `POST {base_url}/chat/completions` endpoints.
# Disable default features to depend only on the portable request/response protocol and the
# `Provider` seam, for example when injecting a fake provider in tests.
openai-completions = ["dep:futures-util", "dep:reqwest", "dep:httpdate"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
httpdate = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }

[package.metadata.docs.rs]
all-features = true
