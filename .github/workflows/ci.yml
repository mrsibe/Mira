name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # Reads the pinned packageManager version from package.json.
      - uses: pnpm/action-setup@v4
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Pi runtime build and offline contract tests
        run: pnpm runtime:test

      # cargo test compiles the library, binary and tests; a separate check
      # would repeat that work. The frontend dist was already built above.
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
          cargo test --locked compiled_runtime -- --ignored
