[package]
name = "mira"
version = "0.1.0"
description = "A Tauri App"
license = "MIT"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
mira-ai = { version = "0.1.0", path = "../../../crates/mira-ai" }
mira-runtime = { version = "0.1.0", path = "../../../crates/mira-runtime" }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
keyring = "2"
tauri-plugin-process = "2.3.1"

[dev-dependencies]
# Async tests drive real sessions and a loopback HTTP fixture; no native service is used.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
